<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#1a0533"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon-192.png"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<title>Psychology Guide</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:linear-gradient(135deg,#1a0533,#2d1b69 50%,#0f2027);font-family:'Segoe UI',sans-serif;color:#e8d5ff;padding:20px;max-width:700px;margin:0 auto}
.header{text-align:center;margin-bottom:24px}
.header .brain{font-size:48px}
h1{font-size:26px;font-weight:800;background:linear-gradient(90deg,#c084fc,#818cf8,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{color:#a78bfa;font-size:13px;margin-top:6px}
.label{font-size:11px;color:#a78bfa;text-transform:uppercase;letter-spacing:1px;margin:16px 0 10px}
input{width:100%;padding:12px 16px;background:rgba(255,255,255,.07);border:1px solid rgba(167,139,250,.4);border-radius:12px;color:#e8d5ff;font-size:14px;outline:none}
input::placeholder{color:#9b7fe6}
.topics{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:rgba(124,58,237,.15);border:1px solid rgba(167,139,250,.3);border-radius:20px;padding:7px 14px;color:#c4b5fd;font-size:13px;cursor:pointer}
.chip.active{background:linear-gradient(135deg,#7c3aed,#4f46e5);border-color:#a78bfa;color:#fff}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(167,139,250,.25);border-radius:16px;padding:18px;margin-top:16px}
.card h2{font-size:20px;margin-bottom:10px;color:#f3e8ff}
.card p{font-size:14px;line-height:1.7;margin-bottom:10px;color:#e2d9f3}
.card h3{font-size:13px;color:#c084fc;margin:12px 0 6px;text-transform:uppercase;letter-spacing:.5px}
.card ul{padding-left:20px}
.card li{font-size:14px;line-height:1.7;margin-bottom:5px;color:#e2d9f3}
.fact{background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.3);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6;color:#bae6fd;margin-top:12px}
.empty{text-align:center;color:#a78bfa;font-size:14px;margin-top:20px}
.footer{text-align:center;font-size:11px;color:#8b6fd6;margin-top:28px;line-height:1.6}
</style>
</head>
<body>

<div class="header">
  <div class="brain">🧠</div>
  <h1>Psychology Guide</h1>
  <p>Apne mann ko samjhein</p>
</div>

<input id="search" placeholder="Topic dhundhein... (jaise: stress, neend, gussa)"/>
<div class="label">Topics</div>
<div class="topics" id="topics"></div>
<div id="content"><div class="empty">👆 Koi topic chunein</div></div>

<div class="footer">Yeh app sirf educational hai.<br>Agar aap bahut pareshan hain, to kisi psychologist ya doctor se zaroor milein.</div>

<script>
const data=[
{e:"🧠",t:"Memory (Yaadasht)",k:"memory yaad yaadasht bhoolna",
 d:"Memory ka matlab hai jaankari ko store karna aur zaroorat par wapas yaad karna. Psychology mein memory ke 3 stage maane jaate hain.",
 p:["Encoding: jaankari ko dimaag mein daalna","Storage: use sambhal kar rakhna","Retrieval: zaroorat par wapas nikalna"],
 h:"Memory ke prakar",
 l:["Sensory memory: kuch seconds tak rehti hai","Short-term memory: lagbhag 20-30 second, kam cheezein","Long-term memory: bahut lamba samay, lagbhag unlimited"],
 tip:"Padhai yaad rakhne ke liye: ek hi baar lambi padhai ke bajaye thodi-thodi der baad dohrayein (spaced repetition) aur khud se test lein.",
 f:"Hum jo padhte hain, usme se kaafi hissa jaldi bhool jaate hain agar dohrate na hon. Isse 'forgetting curve' kehte hain."},
{e:"😴",t:"Dreams (Sapne)",k:"dream sapne sapna neend",
 d:"Sapne neend ke dauraan dikhne wale vichar, tasveerein aur ehsaas hain. Zyadatar vivid sapne REM neend mein aate hain.",
 p:["Freud ka maanna tha ki sapne dabi hui ichchhaon ko dikhate hain","Aaj ke kai vaigyanik maante hain ki sapne din ki yaadon aur emotions ko process karne mein madad karte hain","Sapnon ka asli maksad abhi bhi poori tarah pata nahi hai"],
 h:"Aam baatein",
 l:["Sabko sapne aate hain, chahe yaad na rahein","Tanaav mein sapne zyada vivid ho sakte hain","Bure sapne baar-baar aayein to neend ki aadat sudhaarein"],
 tip:"Sapne yaad rakhne ke liye uthte hi diary mein likh lein.",
 f:"Insaan apni zindagi ka lagbhag ek-tihai hissa sota hai, aur sapne uska ek bada hissa hain."},
{e:"💪",t:"Motivation",k:"motivation prerna himmat lagan",
 d:"Motivation woh andar ya bahar ki shakti hai jo hamein kaam karne ke liye prerit karti hai.",
 p:["Intrinsic motivation: kaam mein maza aane ki wajah se karna","Extrinsic motivation: inaam, paise ya tareef ke liye karna"],
 h:"Motivated rehne ke tareeke",
 l:["Bade goal ko chhote hisson mein todein","Har chhoti jeet ko note karein","Apne kaam ka 'kyun' yaad rakhein","Sahi mahaul aur routine banayein"],
 tip:"Motivation ka intezaar mat karein. Chhota sa kadam uthayein, motivation aksar kaam shuru karne ke baad aati hai.",
 f:"Maslow ki 'Hierarchy of Needs' ke mutabik pehle basic zarooratein (khana, suraksha) poori hona zaroori hai, phir upar ke goals."},
{e:"😰",t:"Anxiety (Ghabrahat)",k:"anxiety ghabrahat tension stress dar chinta",
 d:"Anxiety aage hone wali kisi cheez ke bare mein chinta ya dar ka ehsaas hai. Thodi anxiety normal hai, lekin agar roz ki zindagi mein dikkat kare to madad leni chahiye.",
 p:["Dil tez dhadakna, haath paon kaampna","Baar-baar chinta karna aur sochte rehna","Neend na aana, chidchidapan"],
 h:"Kya madad kar sakta hai",
 l:["Gehri saans: 4 second andar, 6 second bahar","Regular vyayam aur poori neend","Caffeine kam karein","Apne bharosemand logon se baat karein","Zyada ho to therapist ya doctor se milein"],
 tip:"Grounding trick: apne aas paas 5 cheezein dekhein, 4 chhooyein, 3 suniye, 2 sunghiye, 1 chakhiye.",
 f:"Anxiety sabse aam mental health samasyaon mein se ek hai, aur uska ilaaj (therapy, kabhi-kabhi dawai) kaafi asardaar hota hai."},
{e:"❤️",t:"Love & Relationships",k:"love pyaar rishta relationship dosti",
 d:"Achhe rishte bharose, sammaan aur saaf baatcheet par tikte hain. Research batati hai ki achhe rishte sehat aur khushi dono badhate hain.",
 p:["Attachment style: bachpan ke anubhav batate hain ki hum rishton mein kaise jude rehte hain (secure, anxious, avoidant)","Gottman ki research: rishte mein tareef aur sakaratmak baatein, aalochna se kaafi zyada honi chahiye"],
 h:"Healthy rishte ke sanket",
 l:["Khul kar baat kar paana","Ek-dusre ki seema ka sammaan","Jhagde ke baad sulah karna","Apni alag pehchaan aur dosti bani rehna"],
 tip:"Dhyaan se sunein. Jawab dene ke liye nahi, samajhne ke liye sunein.",
 f:"Harvard ki lambi study mein paaya gaya ki achhe rishte lambi aur khush zindagi ke sabse bade sanketon mein se hain."},
{e:"🪞",t:"Self-Esteem",k:"self esteem confidence aatmavishwas",
 d:"Self-esteem yaani aap khud ko kitna keemti aur kaabil maante hain.",
 p:["Kam self-esteem mein insaan khud ki aalochna zyada karta hai","Zyada healthy self-esteem mein insaan galtiyon ke baad bhi khud ko sammaan deta hai"],
 h:"Kaise badhayein",
 l:["Khud se dost ki tarah baat karein","Doosron se tulna kam karein, khaaskar social media par","Chhote goals poore karke bharosa banayein","Apni khoobiyan likhein","Self-compassion apnayein: galti insaani hai"],
 tip:"Jab khud ko bura-bhala kahein, ruk kar sochein: kya main apne dost se aisa kehta?",
 f:"Self-compassion par research batati hai ki khud par daya rakhne wale log naakaami se behtar ubharte hain."},
{e:"😡",t:"Anger (Gussa)",k:"anger gussa krodh",
 d:"Gussa ek normal emotion hai. Samasya tab hoti hai jab hum use control nahi kar paate aur woh rishton ya sehat ko nuksaan pahunchata hai.",
 p:["Gusse ke peeche aksar dard, dar ya nirasha chhupi hoti hai","Gusse mein body mein adrenaline badhta hai, isliye dil tez dhadakta hai"],
 h:"Control karne ke tareeke",
 l:["Reaction se pehle 10 tak ginein","Gehri saans lein aur jagah se hat jayein","Shaant hone ke baad apni baat rakhein","Vyayam ya walk se energy nikaalein","'Tum hamesha...' ki jagah 'mujhe lagta hai...' bolein"],
 tip:"Gusse mein koi bada faisla ya message na bhejein. Pehle shaant ho jayein.",
 f:"Gusse ka sabse tez asar pehle kuch minute mein hota hai. Thoda ruk jaana kaafi madad karta hai."},
{e:"🌙",t:"Sleep (Neend)",k:"sleep neend insomnia aaram",
 d:"Neend mental sehat ke liye bahut zaroori hai. Kam neend se mood, dhyaan aur yaadasht par bura asar padta hai.",
 p:["Zyadatar vayask logon ko 7-9 ghante ki neend chahiye","Neend ke chakra mein light sleep, deep sleep aur REM stage aate hain"],
 h:"Achhi neend ke tareeke",
 l:["Roz ek hi samay par sona aur uthna","Sone se pehle mobile ki screen kam karein","Sham ke baad chai/coffee kam karein","Kamra thanda, andhera aur shaant rakhein","Bistar sirf sone ke liye use karein"],
 tip:"Agar 20 minute tak neend na aaye to uth kar kuch halka aur shaant kaam karein, phir wapas jayein.",
 f:"Kai hafte tak neend ki kami anxiety aur udaasi ka khatra badha sakti hai."},
{e:"😔",t:"Udaasi (Depression)",k:"depression udaasi sad dukh mood",
 d:"Udaasi har kisi ko kabhi-kabhi hoti hai. Lekin agar do hafte ya zyada tak lagatar udaasi, dilchaspi ki kami aur thakaan rahe, to yeh depression ho sakta hai.",
 p:["Pehle jo cheezein achhi lagti thi unme maza na aana","Neend ya bhookh mein badlaav","Khud ko bekaar ya doshi samajhna"],
 h:"Kya karein",
 l:["Kisi bharosemand se apni baat share karein","Chhoti routine banayein: dhoop, walk, regular khana","Professional madad lein, therapy aur ilaaj kaaragar hain"],
 tip:"Agar apko khud ko nuksaan pahunchane ke vichar aayein, turant kisi apne, doctor ya helpline se baat karein. India mein Tele-MANAS helpline 14416 par madad milti hai.",
 f:"Depression ek ilaaj yogya sthiti hai, kamzori ya galti nahi."}
];

const topicsEl=document.getElementById('topics'),contentEl=document.getElementById('content'),search=document.getElementById('search');
let active=null;

function renderChips(list){
  topicsEl.innerHTML='';
  list.forEach(x=>{
    const b=document.createElement('button');
    b.className='chip'+(active===x?' active':'');
    b.textContent=x.e+' '+x.t;
    b.onclick=()=>show(x);
    topicsEl.appendChild(b);
  });
}
function show(x){
  active=x;
  renderChips(filtered());
  contentEl.innerHTML=
  '<div class="card"><h2>'+x.e+' '+x.t+'</h2><p>'+x.d+'</p><h3>Jaanne layak</h3><ul>'+x.p.map(i=>'<li>'+i+'</li>').join('')+'</ul><h3>'+x.h+'</h3><ul>'+x.l.map(i=>'<li>'+i+'</li>').join('')+'</ul><div class="fact">💡 <b>Tip:</b> '+x.tip+'</div><div class="fact" style="background:rgba(192,132,252,.1);border-color:rgba(192,132,252,.3);color:#e9d5ff">✨ <b>Kya aap jaante hain?</b> '+x.f+'</div></div>';
  window.scrollTo({top:contentEl.offsetTop-20,behavior:'smooth'});
}
function filtered(){
  const q=search.value.trim().toLowerCase();
  return q?data.filter(x=>(x.t+' '+x.k).toLowerCase().includes(q)):data;
}
search.addEventListener('input',()=>{
  const f=filtered();
  renderChips(f);
  if(!f.length)contentEl.innerHTML='<div class="empty">Kuch nahi mila. Doosra shabd try karein.</div>';
});
renderChips(data);
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
</html>
